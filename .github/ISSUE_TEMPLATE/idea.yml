name: Idea / request
description: Suggest something that would make WeakAuras Simple Remastered better or simpler
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: What do you want to see on the screen, and when?
    validations:
      required: true
  - type: dropdown
    id: realm
    attributes:
      label: Realm
      options:
        - Conquest of Azeroth (CoA)
        - Classless
        - Both / does not matter
